services:
  db:
    image: mysql:8.0
    container_name: opsflow_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-opsflow_db}
      MYSQL_USER: ${MYSQL_USER:-opsflow_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-opsflow_password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-opsflow_root_password}
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-opsflow_root_password}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  web:
    build: .
    container_name: opsflow_web
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.base
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-django-insecure-local-dev-key-change-me}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-True}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${MYSQL_DATABASE:-opsflow_db}
      DB_USER: ${MYSQL_USER:-opsflow_user}
      DB_PASSWORD: ${MYSQL_PASSWORD:-opsflow_password}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:8000,http://127.0.0.1:8000}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@opsflow.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin@12345}
      MANAGER_EMAIL: ${MANAGER_EMAIL:-manager@opsflow.local}
      MANAGER_PASSWORD: ${MANAGER_PASSWORD:-Manager@12345}
      EMPLOYEE_EMAIL: ${EMPLOYEE_EMAIL:-employee@opsflow.local}
      EMPLOYEE_PASSWORD: ${EMPLOYEE_PASSWORD:-Employee@12345}
    depends_on:
      db:
        condition: service_healthy

volumes:
  mysql_data:
