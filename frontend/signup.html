<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign up - OpsFlow</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="auth-page">
  <div class="auth-card">
    <div class="auth-brand"><span class="logo-mark">OF</span><span>OpsFlow</span></div>
    <h1>Create your account</h1>
    <p class="auth-sub">New accounts are created with the Employee role. An administrator can promote you to Manager later if needed.</p>

    <form id="signup-form" novalidate>
      <div class="form-group">
        <label for="full_name">Full name</label>
        <input class="form-control" type="text" id="full_name" name="full_name" required autocomplete="name">
      </div>
      <div class="form-group">
        <label for="email">Email address</label>
        <input class="form-control" type="email" id="email" name="email" required autocomplete="username">
      </div>
      <div class="form-row">
        <div class="form-group">
          <label for="password">Password</label>
          <input class="form-control" type="password" id="password" name="password" required autocomplete="new-password" minlength="8">
        </div>
        <div class="form-group">
          <label for="password_confirm">Confirm password</label>
          <input class="form-control" type="password" id="password_confirm" name="password_confirm" required autocomplete="new-password" minlength="8">
        </div>
      </div>
      <div class="form-error hidden" id="form-error"></div>
      <button type="submit" class="btn btn-primary btn-block" id="signup-submit">Create account</button>
    </form>

    <p class="auth-foot">Already have an account? <a href="login.html">Log in</a></p>
  </div>
</div>
<script src="js/api.js"></script>
<script src="js/ui.js"></script>
<script src="js/icons.js"></script>
<script src="js/signup.js"></script>
</body>
</html>
