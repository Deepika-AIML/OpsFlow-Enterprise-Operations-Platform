<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset password - OpsFlow</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="auth-page">
  <div class="auth-card">
    <div class="auth-brand"><span class="logo-mark">OF</span><span>OpsFlow</span></div>
    <h1>Set a new password</h1>
    <p class="auth-sub" id="page-sub">Choose a new password for your account.</p>

    <form id="reset-form" novalidate>
      <div class="form-group">
        <label for="new_password">New password</label>
        <input class="form-control" type="password" id="new_password" name="new_password" required minlength="8" autocomplete="new-password">
      </div>
      <div class="form-group">
        <label for="new_password_confirm">Confirm new password</label>
        <input class="form-control" type="password" id="new_password_confirm" name="new_password_confirm" required minlength="8" autocomplete="new-password">
      </div>
      <div class="form-error hidden" id="form-error"></div>
      <button type="submit" class="btn btn-primary btn-block" id="reset-submit">Reset password</button>
    </form>
    <p class="auth-foot"><a href="login.html">Back to log in</a></p>
  </div>
</div>
<script src="js/api.js"></script>
<script src="js/ui.js"></script>
<script src="js/icons.js"></script>
<script src="js/reset-password.js"></script>
</body>
</html>
