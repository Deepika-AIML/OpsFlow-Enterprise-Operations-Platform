<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forgot password - OpsFlow</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="auth-page">
  <div class="auth-card">
    <div class="auth-brand"><span class="logo-mark">OF</span><span>OpsFlow</span></div>
    <h1>Forgot your password?</h1>
    <p class="auth-sub">Enter your email and we'll send you a link to reset it.</p>

    <form id="forgot-form" novalidate>
      <div class="form-group">
        <label for="email">Email address</label>
        <input class="form-control" type="email" id="email" name="email" required autocomplete="username">
      </div>
      <button type="submit" class="btn btn-primary btn-block" id="forgot-submit">Send reset link</button>
    </form>

    <div class="demo-hint hidden" id="result-box"></div>
    <p class="auth-foot"><a href="login.html">Back to log in</a></p>
  </div>
</div>
<script src="js/api.js"></script>
<script src="js/ui.js"></script>
<script src="js/icons.js"></script>
<script src="js/forgot-password.js"></script>
</body>
</html>
